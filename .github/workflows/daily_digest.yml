name: PT Daily Digest Generation

on:
  schedule:
    # 毎朝 06:00 JST (日本時間) = 前日 21:00 UTC
    - cron: '0 21 * * *'
  push:
    branches: [ main ] # リポジトリ更新時にも自動実行
  workflow_dispatch: # GitHub UIからの手動実行用

permissions:
  contents: read # コード読み取り権限
  pages: write    # GitHub Pages へのデプロイ権限
  id-token: write # GitHub Pages デプロイ用トークン

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: main.py の実行 (データ取得＆HTML生成＆メール配信)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python main.py

      - name: GitHub Pages 用アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
