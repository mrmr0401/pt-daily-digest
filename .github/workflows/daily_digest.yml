name: PT Daily Digest Generation

on:
  schedule:
    # 毎朝 06:00 JST (日本時間) = 前日 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub UIからの手動実行用

permissions:
  contents: write # リポジトリへの自動コミット権限
  pages: write    # GitHub Pages へのデプロイ権限
  id-token: write # GitHub Pages デプロイ用トークン

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: main.py の実行 (データ取得＆HTML生成)
        env:
          # 必要に応じて外部APIキーなどをSecretsから読み込む構成
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py

      - name: docs/ の変更を自動コミット＆プッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update PT daily digest data and HTML [skip ci]"
            git push
          fi

      - name: GitHub Pages 用アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
